# Runs the checks on every push and pull request, so a broken change shows
# up as a red cross on GitHub instead of on someone's machine later.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # the same Go the project says it needs
      - name: gofmt
        # gofmt -l lists badly formatted files; any output fails the step.
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
